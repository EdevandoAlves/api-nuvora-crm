version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: nuvora_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: nuvora
    ports:
      - '5432:5432'
    volumes:
      - ./postgres-data:/var/lib/postgresql
